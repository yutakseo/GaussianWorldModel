# @package _global_
defaults:
  - runtime: default
  - world_model: gwm
  - dataset: droid
  - _self_

paths:
  stage: dit

# Training settings
train:
  # Inclusive final optimizer-step index. A resumed run stops exactly here.
  max_steps: 100000  # About 13.8 epochs for DROID-100 with batch size 4
  log_every: 10    # Log metrics every N steps
  plot_every: 100  # Overwrite one train/validation loss graph every N steps
  save_every: 5000  # Save checkpoint every N steps
  # The pretrained Gaussian VAE remains frozen during dynamics training.
  update_tokenizer: false
  update_model: true

# Evaluation settings
eval:
  eval_every: 1000  # Evaluate every N steps
  num_batches: 10   # Number of validation batches per evaluation

# Qualitative rollout settings used by gaussianwm/demo.py.
demo:
  num_samples: 10
  output_dir: ${paths.inference_dir}

# Checkpoints contain weights only. Hydra writes process logs under paths.log_dir.
checkpoint_dir: ${paths.checkpoint_dir}

# Resume training
resume: null  # Path to checkpoint to resume from
start_step: 0
