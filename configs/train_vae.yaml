# @package _global_
defaults:
  - runtime: default
  - dataset: droid
  - vae: transformer
  - _self_

# VAE uses its own seed while sharing runtime/device/distributed settings.
seed: 0
paths:
  stage: vae

# Training settings
train:
  # Each trajectory contributes segment_length Gaussian states. Keeping this
  # small bounds memory for the differentiable rendering objective.
  batch_size: 2
  epochs: 100
  accum_iter: 1
  # Enable CUDA AMP and GradScaler for the VAE update.
  amp: true
  eval_every: 5  # Evaluate every N epochs
  save_every: 10  # Save checkpoint every N epochs
  max_batches_per_epoch: null
  max_eval_batches: null

# Cache frozen Splatt3r outputs after the DROID-specific dense-to-2,048 input
# adaptation. V6 stores one RGB sequence per entry, so shuffled/re-grouped
# RLDS batches reuse the right targets without multiplying cache files.
gaussian_cache:
  enabled: true
  # Keep legacy batch-keyed caches untouched; V6 uses per-sequence entries.
  dir: ${paths.cache_root}/vae/${paths.date}/gaussian_features_v6
  dtype: float16  # Set to float32 for an exact, larger cache.
  # Bound disk use if a stochastic upstream pipeline emits unbounded windows.
  # Known entries remain readable after the cap; only new misses are skipped.
  max_entries: 40000
  # Optional read-only adapter for the old version-4 batch cache. It splits
  # each legacy file back into segment_length sequences, so changing the
  # current DataLoader batch size cannot duplicate or skip cached samples.
  legacy_batch_dir: null

# Optimizer settings
optimizer:
  # Use an explicit learning rate; linear 256-sample scaling makes the
  # rendering-loss batches pathologically small.
  lr: 1e-4
  blr: 1e-4
  epochs: ${train.epochs}
  warmup_epochs: 5
  weight_decay: 0.05
  clip_grad: null  # Gradient clipping norm
  layer_decay: 0.75
  min_lr: 1e-6

# Weights and logs are intentionally separate.
checkpoint_dir: ${paths.checkpoint_dir}
log_dir: ${paths.log_dir}
wandb:
  name: ${vae.name}

# Resume training
resume: null  # Path to checkpoint to resume from
start_epoch: 0
eval_only: false  # Set to true for evaluation only
