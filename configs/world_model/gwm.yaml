# Configuration for Gaussian World Model predictor
# world_model:
_target_: gwm_predictor.GaussianPredictor

model_type: gwm
# Model architecture
model:
  # model_type: DiT_S_2 # One of the DiT model types
  input_size: ${dataset.image_size}
  in_channels: 3
  patch_size: 4
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  class_dropout_prob: 0.0
  learn_sigma: false

# Gaussian Splat parameters
observation:
  use_gs: true
  point_cloud_size: 2048

# 3D VAE parameters
vae:
  use_vae: true
  model_dim: 512
  num_latents: 512
  latent_dim: 64
  decoder_num_queries: null
  vae_depth: 4
  use_kl: true
  min_scale: 1.0e-5
  pretrained_path: ${paths.checkpoint_root}/vae/${paths.date}/checkpoint-latest.pth

# Reward model parameters
reward:
  use_reward_model: false
  reward_weight: 1.0

symlog: true
batch_size: 4
segment_length: ${dataset.segment_length}
context_length: ${dataset.context_length}
action_dim: ${dataset.action_dim}

# Diffusion parameters
diffusion:
  sigma_data: 0.5
  # Standard EDM perturbation from the paper; no channel-wise offset noise.
  sigma_offset_noise: 0.0
  noise_previous_obs: false
  # Paper Appendix B.1 uses P_mean=-0.4 and P_std=1.2.
  sigma_loc: -0.4
  sigma_scale: 1.2
  sigma_min: 2e-3
  sigma_max: 20.0
  num_steps_denoising: 5
  rho: 7
  order: 1

# Optimizer parameters
optimizer:
  model_lr: 1e-4
  max_grad_norm: 10.0
  reward_model_lr: 1e-4
