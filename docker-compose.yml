services:
  gaussianwm:
    build:
      context: .
      dockerfile: Dockerfile
    image: gaussianwm-dev:torch2.5.1-cuda12.1
    container_name: gaussianwm-dev
    # Reap Codex daemon children correctly and bring the container back after
    # Docker/host restarts unless it was explicitly stopped.
    init: true
    restart: unless-stopped
    working_dir: /workspace
    stdin_open: true
    tty: true
    shm_size: "32gb"
    gpus: all
    environment:
      GWM_PATH: /workspace
      PYTHON_BIN: /usr/local/bin/python3
      UV_PYTHON: /usr/local/bin/python3
      # "auto" compiles CUDA extensions for every GPU visible in the container.
      # Override with a semicolon-separated list such as "7.5;8.6" for portable images.
      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-auto}"
      CUDA_HOME: /usr/local/cuda
      GWM_DOWNLOAD_SPLATT3R: "1"
      UV_LINK_MODE: copy
      UV_SYSTEM_PYTHON: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CODEX_REMOTE_CONTROL: "${CODEX_REMOTE_CONTROL:-1}"
    volumes:
      - .:/workspace
      # Keep Codex login, installation identity, and remote-control pairing
      # across container removal/recreation. This directory is gitignored.
      - ./.codex-persist:/root/.codex
      - gaussianwm-uv-cache:/root/.cache/uv
      - gaussianwm-torch-cache:/root/.cache/torch
      - gaussianwm-setup-state:/var/cache/gaussianwm
    entrypoint: ["bash", "/workspace/container_entrypoint.sh"]
    command: sleep infinity

volumes:
  gaussianwm-uv-cache:
  gaussianwm-torch-cache:
  gaussianwm-setup-state:
